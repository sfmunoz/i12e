apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
spec:
  tls:
  - secretName: "${SECRETNAME}"
    hosts:
    - "${HOSTNAME}"
  rules:
  - host: "${HOSTNAME}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: forgejo
            port:
              number: 3000
