#
# https://cert-manager.io/docs/installation/helm/
#

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: cert-manager
  interval: 10m42s
  values:
    crds:
      enabled: true

---

#
# https://kubernetes.recipes/recipes/security/certmanager-ovh-dns01-wildcard-tls/
#

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-ovh
  namespace: cert-manager
spec:
  interval: 1h18m
  timeout: 5m
  chart:
    spec:
      chart: cert-manager-webhook-ovh
      version: 0.9.15
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-ovh
        namespace: cert-manager
      interval: 1h8m
  releaseName: cert-manager-webhook-ovh
  values:
    groupName: acme.i12e
