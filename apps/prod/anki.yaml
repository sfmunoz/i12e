apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: anki
  namespace: anki
spec:
  dependsOn:
  - name: infra
    namespace: flux-system
  - name: secrets
    namespace: flux-system
  interval: 11m05s
  sourceRef:
    kind: ExternalArtifact
    name: apps
    namespace: flux-system
  path: ./apps/anki
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: ingress-conf
        optional: false
