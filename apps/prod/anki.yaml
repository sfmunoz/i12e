apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: anki
  namespace: anki
spec:
  dependsOn:
  - name: infra
    namespace: flux-system
  - name: secrets
    namespace: flux-system
  interval: 11m05s
  sourceRef:
    kind: ExternalArtifact
    name: apps
    namespace: flux-system
  path: ./apps/anki
  prune: true
  wait: true
  postBuild:
    substitute:
      DOCKER_IMAGE: ghcr.io/sfmunoz/anki-sync-server:25.09.2-2
      APPNAME: anki
      NAMESPACE: anki
      DATA_FOLDER: /anki_data
    substituteFrom:
      - kind: Secret
        name: ingress-conf
        optional: false
