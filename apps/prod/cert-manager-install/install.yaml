#
# https://fluxcd.io/flux/components/helm/
#   https://fluxcd.io/flux/components/helm/helmreleases/
# https://fluxcd.io/flux/guides/helmreleases/
# https://fluxcd.io/flux/use-cases/helm/
# ---
#
# https://cert-manager.io/docs/installation/helm/
#


apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 24h42m
  url: oci://quay.io/jetstack/charts/cert-manager
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "v1.21.1"

---

#
# https://cert-manager.io/docs/installation/helm/
#

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: cert-manager
  interval: 10m42s
  values:
    crds:
      enabled: true

---

#
# https://kubernetes.recipes/recipes/security/certmanager-ovh-dns01-wildcard-tls/
#

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager-webhook-ovh
  namespace: cert-manager
spec:
  interval: 24h16m
  url: https://aureq.github.io/cert-manager-webhook-ovh

---

#
# https://kubernetes.recipes/recipes/security/certmanager-ovh-dns01-wildcard-tls/
#

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-ovh
  namespace: cert-manager
spec:
  dependsOn:
  - name: cert-manager
    namespace: cert-manager
  interval: 11m57s
  timeout: 5m
  chart:
    spec:
      chart: cert-manager-webhook-ovh
      version: 0.9.16
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-ovh
        namespace: cert-manager
      interval: 1h8m
  releaseName: cert-manager-webhook-ovh
  values:
    groupName: acme.i12e
