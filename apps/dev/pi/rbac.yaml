apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pi
  namespace: pi
rules:
- apiGroups:
  - ''
  - apps
  - batch
  - autoscaling
  - networking.k8s.io
  - gateway.networking.k8s.io
  - discovery.k8s.io
  - policy
  - coordination.k8s.io
  resources:
  - '*'
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pi
  namespace: pi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pi
subjects:
- kind: ServiceAccount
  name: default
  namespace: pi
