#

apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: wikijs
  namespace: i12e
spec:
  interval: 25h22m
  url: oci://ghcr.io/sfmunoz/wikijs
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.1.0

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wikijs
  namespace: i12e
spec:
  chartRef:
    kind: OCIRepository
    name: wikijs
    namespace: i12e
  interval: 11m26s
  valuesFrom:
    - kind: Secret
      name: wikijs-values-yaml
      valuesKey: values.yaml
