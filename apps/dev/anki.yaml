apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: anki-b
  namespace: anki
spec:
  interval: 11m22s
  sourceRef:
    kind: ExternalArtifact
    name: apps
    namespace: flux-system
  path: ./apps/anki/b
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: anki
  namespace: anki
spec:
  dependsOn:
  - name: anki-b
    namespace: anki
  - name: secrets
    namespace: flux-system
  - name: gateways
    namespace: gateways
  interval: 11m05s
  sourceRef:
    kind: ExternalArtifact
    name: apps
    namespace: flux-system
  path: ./apps/anki
  prune: true
  wait: true
  postBuild:
    substitute:
      DOCKER_IMAGE: ghcr.io/sfmunoz/anki-sync-server:25.09.2-2
      APPNAME: anki
      NAMESPACE: anki
      DATA_FOLDER: /anki_data
    substituteFrom:
      - kind: Secret
        name: routes-conf
        optional: false
