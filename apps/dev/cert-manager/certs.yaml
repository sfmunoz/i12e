apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certs
  namespace: cert-manager
spec:
  dependsOn:
  - name: infra
    namespace: flux-system
  - name: secrets
    namespace: flux-system
  interval: 10m38s
  sourceRef:
    kind: ExternalArtifact
    name: apps
    namespace: flux-system
  path: ./apps/cert-manager/certs
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: certs-config
        optional: false
