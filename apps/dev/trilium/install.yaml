apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trilium-b
  namespace: trilium
spec:
  interval: 11m54s
  sourceRef:
    kind: ExternalArtifact
    name: apps
    namespace: flux-system
  path: ./apps/trilium/b
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trilium-s
  namespace: flux-system
spec:
  dependsOn:
  - name: trilium-b
    namespace: trilium
  interval: 11m30s
  sourceRef:
    kind: ExternalArtifact
    name: secrets
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./secrets/trilium
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trilium-w
  namespace: trilium
spec:
  dependsOn:
  - name: trilium-b
    namespace: trilium
  - name: trilium-s
    namespace: flux-system
  - name: gateways
    namespace: gateways
  interval: 11m44s
  sourceRef:
    kind: ExternalArtifact
    name: apps
    namespace: flux-system
  path: ./apps/trilium/w
  prune: true
  wait: true
  postBuild:
    substitute:
      DOCKER_IMAGE: triliumnext/trilium:v0.104.0
      APPNAME: trilium
      NAMESPACE: trilium
      DATA_FOLDER: /home/node/trilium-data
    substituteFrom:
      - kind: Secret
        name: routes-conf
        optional: false
