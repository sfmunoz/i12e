apiVersion: v1
kind: ConfigMap
metadata:
  name: scripts
  namespace: trilium
data:
  restore.sh: |
    #!/bin/sh
    set -x -e -o pipefail
    date
    ln -s /tools/restic /usr/local/bin/restic
    ln -s /tools/rclone /usr/local/bin/rclone
    date
    rclone sync -v --transfers 1 --stats 10s rem:trilium /backup
    date
    if [ -f "/backup/i12e.lock" ]
    then
      tail -f /dev/null &
      wait $!
      exit 1
    fi
    restic snapshots
    date
    rm -rfv /home/node/trilium-data/*
    date
    restic restore -v -v --tag trilium -t / latest
    date
  backup.sh: |
    #!/bin/sh
    function backup_loop {
      while true
      do
        set -x -e -o pipefail
        date
        sleep $((270 + RANDOM % 60))
        date
        [ -f "$${RESTIC_REPOSITORY}/config" ] || restic init
        date
        restic backup -v -v --tag trilium /home/node/trilium-data
        date
        rclone sync -v --transfers 1 --stats 10s /backup rem:trilium
        date
        { set +x; } 2> /dev/null
      done
    }
    function callback {
      echo "$(date) exiting..."
      exit 0
    }
    set -x -e -o pipefail
    ln -s /tools/restic /usr/local/bin/restic
    ln -s /tools/rclone /usr/local/bin/rclone
    trap callback TERM
    backup_loop &
    wait $!
