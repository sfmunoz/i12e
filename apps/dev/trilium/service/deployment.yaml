apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilium
  namespace: trilium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trilium
  template:
    metadata:
      labels:
        app: trilium
    spec:
      containers:
      - name: trilium
        image: "triliumnext/trilium:v0.104.0"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: data
          mountPath: /home/node/trilium-data/
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: trilium
