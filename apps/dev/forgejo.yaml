apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
  namespace: forgejo
spec:
  dependsOn:
  - name: infra
    namespace: flux-system
  - name: secrets
    namespace: flux-system
  interval: 11m56s
  sourceRef:
    kind: ExternalArtifact
    name: apps
    namespace: flux-system
  path: ./apps/forgejo
  prune: true
  wait: true
  postBuild:
    substitute:
      DOCKER_IMAGE: codeberg.org/forgejo/forgejo:16.0.3
      APPNAME: forgejo
      NAMESPACE: forgejo
      DATA_FOLDER: /data
    substituteFrom:
      - kind: Secret
        name: ingress-conf
        optional: false
