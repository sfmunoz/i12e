apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trilium
  namespace: trilium
spec:
  dependsOn:
  - name: infra
    namespace: flux-system
  - name: secrets
    namespace: flux-system
  interval: 11m44s
  sourceRef:
    kind: ExternalArtifact
    name: apps
    namespace: flux-system
  path: ./apps/trilium
  prune: true
  wait: true
  postBuild:
    substitute:
      DOCKER_IMAGE: triliumnext/trilium:v0.104.0
      NAMESPACE: trilium
      DATA_FOLDER: /home/node/trilium-data
    substituteFrom:
      - kind: Secret
        name: ingress-conf
        optional: false
