#
# https://cert-manager.io/docs/installation/helm/ ->
# -> https://cert-manager.io/docs/installation/kubectl/#verify
#

apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager-test

---

#
# kubectl get issuers -n cert-manager-test test-selfsigned
#

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: test-selfsigned
  namespace: cert-manager-test
spec:
  selfSigned: {}

---

#
# kubectl get certs -n cert-manager-test selfsigned-cert -o yaml
# + kubectl get crs -n cert-manager-test selfsigned-cert-1 -o yaml
# + kubectl get secrets -n cert-manager-test selfsigned-cert-tls
#

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: selfsigned-cert
  namespace: cert-manager-test
spec:
  dnsNames:
    - example.com
  secretName: selfsigned-cert-tls
  issuerRef:
    name: test-selfsigned

---

