# https://github.com/sfmunoz/i12e/issues/276
#
# Equivalent of 040-cert-manager-webhook-ovh.sh as a k3s HelmChart CR,
# so `kubectl apply` works on a k3s server (helm-controller built in).
#
# https://kubernetes.recipes/recipes/security/certmanager-ovh-dns01-wildcard-tls/
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager-webhook-ovh
  namespace: kube-system
spec:
  chart: cert-manager-webhook-ovh
  repo: https://aureq.github.io/cert-manager-webhook-ovh
  version: 0.9.15
  targetNamespace: cert-manager
  createNamespace: true
  valuesContent: |
    groupName: acme.i12e
