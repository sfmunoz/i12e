#
# https://cert-manager.io/docs/concepts/issuer/
# https://cert-manager.io/docs/configuration/ca/
#

#
# $ sudo k3s kubectl create ns cert-manager-test
#
# $ sudo k3s kubectl create secret tls k3s-client-ca \
#   -n cert-manager-test \
#   --key=/var/lib/rancher/k3s/server/tls/client-ca.key \
#   --cert=/var/lib/rancher/k3s/server/tls/client-ca.crt

#apiVersion: v1
#data:
#  tls.crt: LS0tLS1CRUdJ...
#  tls.key: LS0tLS1CRUdJ...
#kind: Secret
#metadata:
#  name: k3s-client-ca
#  namespace: cert-manager-test
#type: kubernetes.io/tls

---

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: k3s-client-ca
  namespace: cert-manager-test
spec:
  ca:
    secretName: k3s-client-ca

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-cert
  namespace: cert-manager-test
spec:
  dnsNames:
    - example.com
  secretName: local-cert
  issuerRef:
    name: k3s-client-ca

---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  strategy: {}
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - image: nginx:latest
        name: nginx
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: web
  name: web
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: web
  type: ClusterIP

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    cert-manager.io/issuer: "k3s-client-ca"
    cert-manager.io/alt-names: "web2.local,web3.local"
spec:
  rules:
  - host: web.local
    http:
      paths:
      - backend:
          service:
            name: web
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - web.local
    secretName: web.local
