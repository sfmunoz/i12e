apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "genesis.fullname" . }}
  labels:
    {{- include "genesis.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "genesis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "genesis.labels" . | nindent 8 }}
    spec:
      hostPID: true
      serviceAccountName: genesis-account
      terminationGracePeriodSeconds: 5
      containers:
      - name: {{ .Chart.Name }}
        image: ghcr.io/sfmunoz/k8s-bulk:v1.8.0
        imagePullPolicy: IfNotPresent
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        # enforce code changes -> container restarted (devel environment)
        - name: PYTHONPATH
          value: /app
        - name: CODE_SHA256SUM
          value: {{ include "genesis.code_sha256sum" . | quote }}
        - name: VALUES_KOPF_PEERING_NAME
          value: {{ .Values.kopf.peering_name | quote }}
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        command: ["sh","-c"]
        args:
        - |
          set -x -e -o pipefail
          python3 /entrypoint/entrypoint.py
          exec python3 -m genesis
        volumeMounts:
        - mountPath: /genesis
          name: vol-host
          readOnly: false
        - mountPath: /entrypoint
          name: entrypoint-vol
        - mountPath: /sec
          name: secret-vol
      volumes:
      - name: vol-host
        hostPath:
          path: /
          type: Directory
      - name: entrypoint-vol
        configMap:
          name: genesis
          items:
          - key: entrypoint-py
            path: entrypoint.py
          - key: code-blob
            path: code.blob
      - name: secret-vol
        secret:
          secretName: genesis
