variant: flatcar
version: 1.0.0
systemd:
  units:
  - name: i12e.service
    enabled: true
    contents: |
      [Unit]
      Description=i12e
      Wants=network-online.target
      After=network-online.target
      [Service]
      Type=simple
      Restart=always
      RestartSec=5s
      ExecStartPre=/bin/sh -c 'set -e -x -o pipefail ; echo "b15970e9c0873f647ccac7f22a9b26ce653517264600a87546e472cb1d73dbbb  /usr/bin/i12e" | sha256sum -c'
      ExecStart=/bin/sh -c 'if [ -x /opt/bin/i12e ]; then exec /opt/bin/i12e; else exec /usr/bin/i12e; fi'
      [Install]
      WantedBy=multi-user.target
storage:
  directories:
  - path: /etc/i12e
    overwrite: true
    mode: 0700
    user:
      name: root
    group:
      name: root
  files:
  - path: /etc/i12e/mode
    overwrite: true
    mode: 0600
    user:
      name: root
    group:
      name: root
    contents:
      inline: |
        {{ mode }}
  - path: /etc/extensions/i12e-flatcar.raw
    overwrite: true
    mode: 0644
    user:
      name: root
    group:
      name: root
    contents:
      source: https://github.com/sfmunoz/i12e/releases/download/v0.0.8/i12e-flatcar.raw
  - path: /root/.config/rclone/rclone.conf
    overwrite: true
    mode: 0600
    user:
      name: root
    group:
      name: root
    contents:
      inline: |
        {{ rclone_conf | indent(8) }}
  - path: /home/core/.config/rclone/rclone.conf
    overwrite: true
    mode: 0600
    user:
      name: core
    group:
      name: core
    contents:
      inline: |
        {{ rclone_conf | indent(8) }}
  links:
      # orig: /usr/share/flatcar/sysext/docker-flatcar.raw
    - path: /etc/extensions/docker-flatcar.raw
      target: /dev/null
      overwrite: true
      # orig: /usr/share/flatcar/sysext/containerd-flatcar.raw
    - path: /etc/extensions/containerd-flatcar.raw
      target: /dev/null
      overwrite: true
passwd:
  users:
  - name: core
    ssh_authorized_keys:
    {%- for k in ssh_authorized_keys %}
    - "{{ k }}"
    {% endfor %}
