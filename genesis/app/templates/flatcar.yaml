storage:
  files:
  - path: /root/.config/rclone/rclone.conf
    overwrite: true
    mode: 0600
    contents:
      inline: |
        {{ rclone_conf | indent(8) }}
  - path: /home/core/.config/rclone/rclone.conf
    overwrite: true
    mode: 0600
    user:
      name: core
    group:
      name: core
    contents:
      inline: |
        {{ rclone_conf | indent(8) }}
