variant: flatcar
version: 1.0.0
systemd:
  units:
  - name: i12e-install.service
    enabled: true
    contents: |
      [Unit]
      Description=i12e install
      Wants=network-online.target
      After=network-online.target
      ConditionFirstBoot=yes
      [Service]
      Type=oneshot
      Restart=on-failure
      RemainAfterExit=true
      ExecStart=/opt/libexec/i12e-install.sh main
      [Install]
      WantedBy=multi-user.target
storage:
  files:
  - path: /opt/libexec/i12e-install.sh
    overwrite: true
    mode: 0700
    contents:
      inline: |
        #!/bin/bash
        set -e -o pipefail
        MODE="$1"
        case "$MODE" in
          main|server|agent) ;;
          *)
            echo "error: unknown MODE='$MODE'"
            exit 1
          ;;
        esac
        set -x
        echo "b15970e9c0873f647ccac7f22a9b26ce653517264600a87546e472cb1d73dbbb  /usr/bin/i12e" | sha256sum -c
        mkdir -p /etc/i12e
        echo "$MODE" > /etc/i12e/mode
        chown 0:0 /etc/i12e /etc/i12e/mode
        chmod 700 /etc/i12e
        chmod 600 /etc/i12e/mode
        I12E_INSTALL=1 /usr/bin/i12e
  - path: /etc/extensions/i12e-flatcar.raw
    overwrite: true
    mode: 0644
    user:
      name: root
    group:
      name: root
    contents:
      source: https://github.com/sfmunoz/i12e/releases/download/v0.0.8/i12e-flatcar.raw
  - path: /root/.config/rclone/rclone.conf
    overwrite: true
    mode: 0600
    user:
      name: root
    group:
      name: root
    contents:
      inline: |
        {{ rclone_conf | indent(8) }}
  - path: /home/core/.config/rclone/rclone.conf
    overwrite: true
    mode: 0600
    user:
      name: core
    group:
      name: core
    contents:
      inline: |
        {{ rclone_conf | indent(8) }}
  links:
      # orig: /usr/share/flatcar/sysext/docker-flatcar.raw
    - path: /etc/extensions/docker-flatcar.raw
      target: /dev/null
      overwrite: true
      # orig: /usr/share/flatcar/sysext/containerd-flatcar.raw
    - path: /etc/extensions/containerd-flatcar.raw
      target: /dev/null
      overwrite: true
passwd:
  users:
  - name: core
    ssh_authorized_keys:
    {%- for k in ssh_authorized_keys %}
    - "{{ k }}"
    {% endfor %}
