variant: flatcar
version: 1.0.0
systemd:
  units:
  - name: i12e-install.service
    enabled: true
    contents: |
      [Unit]
      Description=i12e install
      Wants=network-online.target
      After=network-online.target
      ConditionFirstBoot=yes
      [Service]
      Type=oneshot
      Restart=on-failure
      RemainAfterExit=true
      ExecStart=/usr/bin/bash -c 'set -e -o pipefail ; curl -sfL https://raw.githubusercontent.com/sfmunoz/i12e/refs/tags/v0.0.8/scripts/install.sh | sh -'
      [Install]
      WantedBy=multi-user.target
storage:
  files:
  - path: /root/.config/rclone/rclone.conf
    overwrite: true
    mode: 0600
    contents:
      inline: |
        {{ rclone_conf | indent(8) }}
  - path: /home/core/.config/rclone/rclone.conf
    overwrite: true
    mode: 0600
    user:
      name: core
    group:
      name: core
    contents:
      inline: |
        {{ rclone_conf | indent(8) }}
passwd:
  users:
  - name: core
    ssh_authorized_keys:
    {%- for k in ssh_authorized_keys %}
    - "{{ k }}"
    {% endfor %}
