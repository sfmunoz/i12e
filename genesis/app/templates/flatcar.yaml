variant: flatcar
version: 1.0.0
systemd:
  units:
  - name: i12e-install.service
    enabled: true
    contents: |
      [Unit]
      Description=i12e install
      Wants=network-online.target
      After=network-online.target
      ConditionFirstBoot=yes
      [Service]
      Type=oneshot
      Restart=on-failure
      RemainAfterExit=true
      #Environment="INSTALL_K3S_VERSION={{ k3s_version }}"
      ExecStart=/usr/bin/bash -c 'set -e -o pipefail ; curl -sfL https://raw.githubusercontent.com/sfmunoz/i12e/refs/tags/v0.0.6/scripts/install.sh | sh -'
      [Install]
      WantedBy=multi-user.target
