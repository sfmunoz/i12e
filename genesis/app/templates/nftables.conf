# nft list table inet filter
define k_p0 = {6443}
define k_p1 = 5000
define k_p2 = 6000
define k_p3 = 7000
define k_p4 = 8000
table inet filter {
  set k_ipv4_cli { type ipv4_addr; flags timeout; }
  set k_ipv6_cli { type ipv6_addr; flags timeout; }
  set k_ipv4_bid { type ipv4_addr . inet_service; flags timeout; }
  set k_ipv6_bid { type ipv6_addr . inet_service; flags timeout; }
  chain input {
    type filter hook input priority raw; policy accept;
    iifname {"eth*"} jump input_public
    counter
  }
  chain forward {
    type filter hook forward priority raw; policy accept;
    counter
  }
  chain output {
    type filter hook forward priority raw; policy accept;
    counter
  }
  chain input_public {
    meta l4proto {tcp,udp} ct state { established, related } counter accept
    meta l4proto ipv6-icmp counter accept  # XXX: don't block it: IPv6 doesn't work otherwise (doesn't seem to move from private to public IP)
    meta l4proto icmp counter accept
    meta l4proto {tcp} th dport {22} ct state {new} counter accept       # both ipv4/ipv6
    meta l4proto tcp jump input_knock
    counter reject
  }
  chain input_knock {
    # IPv4
    tcp dport $k_p1 add @k_ipv4_bid {ip  saddr . $k_p2 timeout 10s} drop
    tcp dport $k_p2 ip  saddr . tcp dport @k_ipv4_bid add @k_ipv4_bid {ip  saddr . $k_p3 timeout 10s} drop
    tcp dport $k_p3 ip  saddr . tcp dport @k_ipv4_bid add @k_ipv4_bid {ip  saddr . $k_p4 timeout 10s} drop
    tcp dport $k_p4 ip  saddr . tcp dport @k_ipv4_bid add @k_ipv4_cli {ip  saddr timeout 60s} log prefix "[k ok] " drop
    # IPv6
    tcp dport $k_p1 add @k_ipv6_bid {ip6 saddr . $k_p2 timeout 10s}
    tcp dport $k_p2 ip6 saddr . tcp dport @k_ipv6_bid add @k_ipv6_bid {ip6 saddr . $k_p3 timeout 10s} drop
    tcp dport $k_p3 ip6 saddr . tcp dport @k_ipv6_bid add @k_ipv6_bid {ip6 saddr . $k_p4 timeout 10s} drop
    tcp dport $k_p4 ip6 saddr . tcp dport @k_ipv6_bid add @k_ipv6_cli {ip6 saddr timeout 60s} log prefix "[k ok] " drop
    # Decisions
    tcp dport $k_p0 ip  saddr @k_ipv4_cli counter accept
    tcp dport $k_p0 ip6 saddr @k_ipv6_cli counter accept
    tcp dport $k_p0 ct state established,related counter accept
    tcp dport $k_p0 counter reject with tcp reset
    return
  }
}
