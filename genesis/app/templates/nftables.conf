# nft list table inet filter
define k_p0 = {6443}
define k_p1 = 5000
define k_p2 = 6000
define k_p3 = 7000
define k_p4 = 8000
table inet filter {
  set k4_open { type ipv4_addr; timeout 10s; }
  set k6_open { type ipv6_addr; timeout 10s; }
  set k4_bid { type ipv4_addr . inet_service; timeout 10s; }
  set k6_bid { type ipv6_addr . inet_service; timeout 10s; }
  chain input {
    type filter hook input priority raw; policy accept;
    iifname {"eth*"} jump input_public
    counter
  }
  chain forward {
    type filter hook forward priority raw; policy accept;
    counter
  }
  chain output {
    type filter hook forward priority raw; policy accept;
    counter
  }
  chain input_public {
    meta l4proto {tcp,udp} ct state { established, related } counter accept
    meta l4proto ipv6-icmp counter accept  # XXX: don't block it: IPv6 doesn't work otherwise (doesn't seem to move from private to public IP)
    meta l4proto icmp counter accept
    meta l4proto {tcp} th dport {22} ct state {new} counter accept       # both ipv4/ipv6
    meta l4proto tcp jump input_knock
    counter reject
  }
  chain input_knock {
    jump input_knock_ipv4
    jump input_knock_ipv6
    return
  }
  chain input_knock_ipv4 {
    tcp dport $k_p1 add @k4_bid {ip saddr . $k_p2} drop
    tcp dport $k_p2 ip saddr . tcp dport @k4_bid add @k4_bid {ip saddr . $k_p3} drop
    tcp dport $k_p3 ip saddr . tcp dport @k4_bid add @k4_bid {ip saddr . $k_p4} drop
    tcp dport $k_p4 ip saddr . tcp dport @k4_bid add @k4_open {ip saddr} log prefix "[k4_open] " drop
    tcp dport $k_p0 ip saddr @k4_open counter accept
    return
  }
  chain input_knock_ipv6 {
    tcp dport $k_p1 add @k6_bid {ip6 saddr . $k_p2} drop
    tcp dport $k_p2 ip6 saddr . tcp dport @k6_bid add @k6_bid {ip6 saddr . $k_p3} drop
    tcp dport $k_p3 ip6 saddr . tcp dport @k6_bid add @k6_bid {ip6 saddr . $k_p4} drop
    tcp dport $k_p4 ip6 saddr . tcp dport @k6_bid add @k6_open {ip6 saddr} log prefix "[k6_open] " drop
    tcp dport $k_p0 ip6 saddr @k6_open counter accept
    return
  }
}
