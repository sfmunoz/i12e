#
# Ref: https://github.com/fluxcd/flux2-kustomize-helm-example/blob/main/clusters/production/artifacts.yaml
#

---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: flux-system
  namespace: flux-system
spec:
  sources:
    - alias: monorepo
      kind: GitRepository
      name: flux-system
  artifacts:
    - name: infra
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/infra/prod/**"
          to: "@artifact/infra/"
    - name: apps
      originRevision: "@monorepo"
      copy:
        - from: "@monorepo/apps/prod/**"
          to: "@artifact/apps/"
---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: secrets
  namespace: flux-system
spec:
  sources:
    - alias: secretsrepo
      kind: GitRepository
      name: secrets
  artifacts:
    - name: secrets
      originRevision: "@secretsrepo"
      copy:
        - from: "@secretsrepo/clusters/prod/**"
          to: "@artifact/secrets/"
