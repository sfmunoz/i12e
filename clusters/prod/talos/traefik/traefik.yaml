apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: traefik
spec:
  dependsOn:
  - name: traefik-crds
    namespace: traefik
  interval: 11m55s
  sourceRef:
    kind: ExternalArtifact
    name: clusters
    namespace: flux-system
  path: ./clusters/talos/traefik/traefik
  prune: true
  wait: true
