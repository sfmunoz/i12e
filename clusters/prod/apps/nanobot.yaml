apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nanobot
  namespace: flux-system
spec:
  dependsOn:
  - name: gateways
    namespace: flux-system
  interval: 13m22s
  sourceRef:
    kind: ExternalArtifact
    name: blend-scripts
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./blend/nanobot
  prune: true
  wait: true
  postBuild:
    substitute:
      DOCKER_IMAGE: ghcr.io/sfmunoz/k8s-bulk:6.0.0
      APPNAME: nanobot
      NAMESPACE: nanobot
      DATA_FOLDER: /home/bulk
    substituteFrom:
      - kind: Secret
        name: routes-conf
        optional: false
