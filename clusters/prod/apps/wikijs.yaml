apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wikijs
  namespace: flux-system
spec:
  dependsOn:
  - name: gateways
    namespace: flux-system
  interval: 11m26s
  sourceRef:
    kind: ExternalArtifact
    name: blend
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./blend/wikijs
  prune: true
  wait: true
