apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: i12e
  namespace: flux-system
spec:
  dependsOn:
  - name: csi-rclone
    namespace: flux-system
  interval: 11m38s
  sourceRef:
    kind: ExternalArtifact
    name: blend
    namespace: flux-system
  path: ./blend/i12e
  prune: true
  wait: true
