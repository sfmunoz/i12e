apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wikijs
  namespace: i12e
spec:
  chartRef:
    kind: OCIRepository
    name: wikijs
    namespace: i12e
  interval: 11m26s
  valuesFrom:
    - kind: Secret
      name: wikijs-conf
      valuesKey: values.yaml
