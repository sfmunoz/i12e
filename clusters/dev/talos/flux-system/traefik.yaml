# https://github.com/traefik/traefik-helm-chart

apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 25h32m
  url: oci://ghcr.io/traefik/helm/traefik
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 41.6.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: traefik
  interval: 11m46s
  #valuesFrom:
  #  - kind: Secret
  #    name: traefik-values-yaml
  #    valuesKey: values.yaml
