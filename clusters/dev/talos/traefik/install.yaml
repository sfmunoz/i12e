#
# https://github.com/traefik/traefik-helm-chart
#
# ref: https://doc.traefik.io/traefik/reference/install-configuration/entrypoints/
#
# "--entrypoints.web.http.redirections.entryPoint.to=websecure" doesn't work
# because redir to :8443 is done (internal port) instead of :443 (public port)
#
# http://localhost:8080/dashboard/ → "--api.insecure=true"
#
#   $ kubectl get deployments.apps -n kube-system traefik -o yaml         → verify
#   $ kubectl port-forward -n kube-system deployments/traefik 8080:8080   → forward traffic
#

apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 25h32m
  url: oci://ghcr.io/traefik/helm/traefik
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 41.6.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: traefik
  interval: 11m46s
  values:
    additionalArguments:
      - "--api.insecure=true"
      - "--entrypoints.web.http.redirections.entryPoint.to=:443"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entryPoint.permanent=true"
