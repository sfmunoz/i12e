apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-cfg
  namespace: metallb-system
spec:
  dependsOn:
  - name: metallb
    namespace: metallb-system
  interval: 13m24s
  sourceRef:
    kind: ExternalArtifact
    name: clusters
    namespace: flux-system
  path: ./clusters/talos/metallb-system/cfg
  prune: true
  wait: true
