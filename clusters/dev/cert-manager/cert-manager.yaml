#
# https://cert-manager.io/docs/installation/helm/
#

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: flux-system
  interval: 10m42s
  values:
    crds:
      enabled: true
