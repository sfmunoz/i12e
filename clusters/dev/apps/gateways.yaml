apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateways
  namespace: flux-system
spec:
  interval: 11m01s
  sourceRef:
    kind: ExternalArtifact
    name: blend
    namespace: flux-system
  path: ./blend/gateways
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: gateway-conf
        optional: false
