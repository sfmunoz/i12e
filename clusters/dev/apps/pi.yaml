apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pi
  namespace: flux-system
spec:
  interval: 12m37s
  sourceRef:
    kind: ExternalArtifact
    name: blend-scripts
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./blend/pi
  prune: true
  wait: true
  postBuild:
    substitute:
      DOCKER_IMAGE: ghcr.io/sfmunoz/k8s-bulk:6.0.0
      APPNAME: pi
      NAMESPACE: pi
      DATA_FOLDER: /home/bulk
