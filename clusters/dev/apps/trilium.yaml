apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trilium
  namespace: flux-system
spec:
  dependsOn:
  - name: gateways
    namespace: gateways
  interval: 11m44s
  sourceRef:
    kind: ExternalArtifact
    name: blend-scripts
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./blend/trilium
  prune: true
  wait: true
  postBuild:
    substitute:
      DOCKER_IMAGE: triliumnext/trilium:v0.104.0
      APPNAME: trilium
      NAMESPACE: trilium
      DATA_FOLDER: /home/node/trilium-data
    substituteFrom:
      - kind: Secret
        name: routes-conf
        optional: false
