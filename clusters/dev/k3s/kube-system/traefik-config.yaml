#
# ref: https://doc.traefik.io/traefik/reference/install-configuration/entrypoints/
#
# Redirect through websecure; the chart resolves it to its public port, :443.
#
# http://localhost:8080/dashboard/ → api.insecure: true
#
#   $ kubectl get deployments.apps -n kube-system traefik -o yaml         → verify
#   $ kubectl port-forward -n kube-system deployments/traefik 8080:8080   → forward traffic
#

apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  values:
    api:
      insecure: true
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    providers:
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: false
