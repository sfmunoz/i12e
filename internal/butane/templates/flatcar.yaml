variant: flatcar
version: 1.0.0
ignition:
  config:
    merge:
     - local: {{ .IgnitionConfigMergeLocal }}
systemd:
  units:
  - name: i12e.service
    enabled: true
    contents: |
      [Unit]
      Description=i12e
      Wants=network-online.target
      After=network-online.target
      [Service]
      Type=simple
      Restart=always
      RestartSec=5s
      ExecStartPre=/bin/sh -c 'set -e -x -o pipefail ; echo "{{ .I12eSha256sum }}  /etc/extensions/i12e-flatcar.raw" | sha256sum -c'
      ExecStart=/usr/bin/i12e
      [Install]
      WantedBy=multi-user.target
storage:
  directories:
  - path: /etc/i12e
    overwrite: true
    mode: 0700
    user:
      name: root
    group:
      name: root
  files:
  - path: /etc/i12e/mode
    overwrite: true
    mode: 0600
    user:
      name: root
    group:
      name: root
    contents:
      inline: |
        {{ .Mode }}
  - path: /etc/extensions/i12e-flatcar.raw
    overwrite: true
    mode: 0644
    user:
      name: root
    group:
      name: root
    contents:
      source: https://github.com/sfmunoz/i12e/releases/download/{{ .I12eVersion }}/i12e-flatcar.raw
  - path: /root/.config/rclone/rclone.conf
    overwrite: true
    mode: 0600
    user:
      name: root
    group:
      name: root
    contents:
      inline: |
        {{ .RcloneConf }}
  - path: /home/core/.config/rclone/rclone.conf
    overwrite: true
    mode: 0600
    user:
      name: core
    group:
      name: core
    contents:
      inline: |
        {{ .RcloneConf }}
  links:
      # orig: /usr/share/flatcar/sysext/docker-flatcar.raw
    - path: /etc/extensions/docker-flatcar.raw
      target: /dev/null
      overwrite: true
      # orig: /usr/share/flatcar/sysext/containerd-flatcar.raw
    - path: /etc/extensions/containerd-flatcar.raw
      target: /dev/null
      overwrite: true
passwd:
  users:
  - name: core
    ssh_authorized_keys:
    {{- range .SshAuthorizedKeys }}
    - "{{ . }}"
    {{- end }}
