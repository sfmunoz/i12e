# https://cert-manager.io/docs/installation/helm/

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart: oci://quay.io/jetstack/charts/cert-manager
  version: v1.21.1
  targetNamespace: cert-manager
  createNamespace: true
  set:
    crds.enabled: "true"
