#
# https://cert-manager.io/docs/installation/helm/
#

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart: oci://quay.io/jetstack/charts/cert-manager
  version: v1.21.1
  targetNamespace: cert-manager
  createNamespace: true
  set:
    crds.enabled: "true"

---

#
# https://kubernetes.recipes/recipes/security/certmanager-ovh-dns01-wildcard-tls/
#

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager-webhook-ovh
  namespace: kube-system
spec:
  chart: cert-manager-webhook-ovh
  repo: https://aureq.github.io/cert-manager-webhook-ovh
  version: 0.9.15
  targetNamespace: cert-manager
  createNamespace: true
  valuesContent: |
    groupName: acme.i12e

---

#
# https://cert-manager.io/docs/installation/helm/ -> -> https://cert-manager.io/docs/installation/kubectl/#verify
#

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cert-manager-selfsigned
  namespace: cert-manager
spec:
  selfSigned: {}

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-selfsigned
  namespace: cert-manager
spec:
  dnsNames:
    - cert.local
  secretName: cert-selfsigned
  issuerRef:
    name: cert-manager-selfsigned

