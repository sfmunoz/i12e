# ref:
#   https://wiki.nftables.org/wiki-nftables/index.php/Netfilter_hooks
# cmds:
#   # nft list table inet filter
#   $ for i in {{ range $p := .PortKnocking }}{{ $p }} {{ end }}; do nc -w1 -vz <IP> $i ; done
define k_p0 = {22}
{{- range $i,$p := .PortKnocking }}
define k_p{{ add $i 1 }} = {{ $p }}
{{- end }}
table inet filter {
  set k4_open { type ipv4_addr; timeout 10s; }
  set k6_open { type ipv6_addr; timeout 10s; }
  set k4_bid { type ipv4_addr . inet_service; timeout 10s; }
  set k6_bid { type ipv6_addr . inet_service; timeout 10s; }
  chain prerouting {
    type filter hook prerouting priority raw; policy drop;
    tcp dport 80 counter reject
    counter accept
  }
  chain input {
    type filter hook input priority raw; policy drop;
    udp dport {{ .EndpointPort }} counter accept
    iifname != {"lo","veth*","cni*","flannel*","wg*"} jump input_public
    counter accept
  }
  chain forward {
    type filter hook forward priority raw; policy drop;
    counter accept
  }
  chain output {
    type filter hook output priority raw; policy drop;
    counter accept
  }
  chain input_public {
    meta l4proto {tcp,udp} ct state { established, related } counter accept
    meta l4proto {icmp,ipv6-icmp} counter accept  # don't block ipv6-icmp -> IPv6 doesn't work otherwise (doesn't seem to move from private to public IP)
    meta l4proto tcp counter jump input_knock
    counter drop
  }
  chain input_knock {
    counter jump input_knock_ipv4
    counter jump input_knock_ipv6
    counter return
  }
  chain input_knock_ipv4 {
    tcp dport $k_p1 add @k4_bid {ip saddr . $k_p2} counter drop
    tcp dport $k_p2 ip saddr . tcp dport @k4_bid add @k4_bid {ip saddr . $k_p3} counter drop
    tcp dport $k_p3 ip saddr . tcp dport @k4_bid add @k4_bid {ip saddr . $k_p4} counter drop
    tcp dport $k_p4 ip saddr . tcp dport @k4_bid add @k4_open {ip saddr} log prefix "[k4_open] " counter drop
    tcp dport $k_p0 ip saddr @k4_open counter accept
    counter return
  }
  chain input_knock_ipv6 {
    tcp dport $k_p1 add @k6_bid {ip6 saddr . $k_p2} drop
    tcp dport $k_p2 ip6 saddr . tcp dport @k6_bid add @k6_bid {ip6 saddr . $k_p3} drop
    tcp dport $k_p3 ip6 saddr . tcp dport @k6_bid add @k6_bid {ip6 saddr . $k_p4} drop
    tcp dport $k_p4 ip6 saddr . tcp dport @k6_bid add @k6_open {ip6 saddr} log prefix "[k6_open] " drop
    tcp dport $k_p0 ip6 saddr @k6_open counter accept
    counter return
  }
}
